name: Limpiar cuentas no verificadas

on:
  schedule:
    - cron: "*/10 * * * *"  # cada 10 minutos
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de limpieza
        run: |
          curl -X POST https://amls-backend.onrender.com/internal/limpiar-cuentas \
            -H "x-internal-secret: ${{ secrets.INTERNAL_CLEANUP_SECRET }}"
